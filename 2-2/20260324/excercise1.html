<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>CSS 版面練習</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background-color: #d4dada;
            }

            header {
                background-color: #5a7373;
                color: white;
                text-align: center;
                padding: 20px;
            }

            nav {
                background-color: #3d5050;
                color: white;
                text-align: center;
                padding: 15px;
            }

            aside.left {
                float: left;
                width: 20%;
                background-color: #7a9999;
                color: white;
                text-align: center;
                padding: 80px 10px;
            }

            aside.right {
                float: right;
                width: 20%;
                background-color: #7a9999;
                color: white;
                text-align: center;
                padding: 80px 10px;
            }

            section {
                margin: 0 20%;
                background-color: #a8c4c4;
                color: #333;
                text-align: center;
                padding: 80px;
            }

            footer {
                background-color: #3d5050;
                color: white;
                text-align: center;
                padding: 20px;
            }
        </style>
    </head>

    <body>
        <header><b>HEADER 標題</b></header>
        <nav><b>NAV 導覽列</b></nav>
        <aside class="left"><b>ASIDE1 左側邊</b></aside>
        <aside class="right"><b>ASIDE2 右側邊</b></aside>
        <section><b>SECTION 區塊</b></section>
        <footer><b>FOOTER 頁尾</b></footer>

    </body>
</html>
