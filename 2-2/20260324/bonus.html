<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>多階層選單</title>
        <style>
            body {
                padding: 30px;
            }

            ul {
                list-style: none;
            }

            .menu {
                display: inline-block;
                border: 1px solid #ccc;
            }
            .menu > li {
                float: left;
                position: relative;
            }
            .menu > li > a {
                display: block;
                width: 110px;
                padding: 15px 0;
                text-align: center;
                color: #333;
                text-decoration: none;
                font-size: 15px;
            }

            .menu li:hover > a {
                background-color: #e85d2f;
            }

            .menu li ul {
                display: none;
                position: absolute;
                background-color: white;
                border: 1px solid #ccc;
                min-width: 130px;
            }

            .menu > li:hover > ul {
                display: block;
                top: 100%;
                left: 0;
            }

            .menu li li {
                position: relative;
            }
            
            .menu li li:hover > ul {
                display: block;
                top: 0;
                left: 100%;
            }

            .menu li li > a {
                display: block;
                padding: 12px 18px;
                color: #333;
                text-decoration: none;
                white-space: nowrap;
            }
        </style>
    </head>
    <body>

        <ul class="menu">
            <li><a href="#">校園資訊</a></li>
            <li>
                <a href="#">教學研究</a>
                <ul>
                    <li><a href="#">醫學院</a></li>
                    <li><a href="#">研究中心</a></li>
                    <li>
                        <a href="#">研究單位</a>
                        <ul>
                            <li><a href="#">分子醫學研究中心</a></li>
                            <li><a href="#">新興病毒研究中心</a></li>
                            <li><a href="#">綠色科技研究中心</a></li>
                        </ul>
                    </li>
                    <li><a href="#">研究查詢</a></li>
                </ul>
            </li>
            <li><a href="#">行政服務</a></li>
            <li><a href="#">招生資訊</a></li>
        </ul>

    </body>
</html>
