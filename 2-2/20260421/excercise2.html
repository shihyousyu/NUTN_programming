<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Ch09 Lab_計算機.html</title>
        <style>
            #ans {
                width: 203px;
                height: 40px;
                text-align: right;
            }

            .normal {
                width: 50px;
                height: 50px;
                font-size: 18px;
                text-align: center;
            }

            .big {
                width: 102px;
                height: 50px;
                font-size: 18px;
                text-align: center;
            }

            table {
                margin: 0 auto;
            }
        </style>
    </head>
    <body align="center">
        <p>Copyright © NUTN</p>
        <input type="text" id="ans" value="0">

        <table>
            <script>
                let t = ["C", "DEL", "%", "+", "7", "8", "9", "-", "4", "5", "6", "*", "1", "2", "3", "/"];

                for(let i = 0; i < 4; i++){
                    document.writeln("<tr>");
                    for(let j = 0; j < 4; j++){
                        let val = t[4*i + j];
                        document.writeln(`<td><input type="button" class="normal" value="${val}" onclick="pushBtn('${val}')"></td>`);
                    }
                    document.writeln("</tr>");
                }

                document.writeln("<tr>");
                document.writeln(`<td colspan="2"><input type="button" class="big" value="0" onclick="pushBtn('0')"></td>`);
                document.writeln(`<td><input type="button" class="normal" value="." onclick="pushBtn('.')"></td>`);
                document.writeln(`<td><input type="button" class="normal" value="=" onclick="calculate()"></td>`);
                document.writeln("</tr>");

                function pushBtn(val) {
                    let ans = document.getElementById("ans");

                    if(val === "DEL"){
                        ans.value = ans.value.slice(0, -1);
                        if(ans.value === "") ans.value = "0";
                    }
                    else if(val === "C"){ans.value = "0";}
                    else{
                        if(ans.value === "0" || ans.value === "Error")
                            ans.value = val;
                        else
                            ans.value += val;
                    }
                }
                function evaluateExpression(expression){
                    const tokens = expression.match(/(?:\d+(?:\.\d*)?|\.\d+)|[+*/%()-]/g) || [];
                    if(tokens.join("") !== expression.replace(/\s/g, "")) throw new Error("Invalid expression");
                    let index = 0;
                    function factor(){
                        if(tokens[index] === "+"){index++; return factor();}
                        if(tokens[index] === "-"){index++; return -factor();}
                        if(tokens[index] === "("){
                            index++;
                            const value = sum();
                            if(tokens[index++] !== ")") throw new Error("Missing )");
                            return value;
                        }
                        const token = tokens[index++];
                        if(!token || !/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(token)) throw new Error("Expected number");
                        return Number(token);
                    }
                    function product(){
                        let value = factor();
                        while(["*", "/", "%"].includes(tokens[index])){
                            const op = tokens[index++], right = factor();
                            if((op === "/" || op === "%") && right === 0) throw new Error("Division by zero");
                            value = op === "*" ? value * right : op === "/" ? value / right : value % right;
                        }
                        return value;
                    }
                    function sum(){
                        let value = product();
                        while(tokens[index] === "+" || tokens[index] === "-"){
                            const op = tokens[index++], right = product();
                            value = op === "+" ? value + right : value - right;
                        }
                        return value;
                    }
                    const value = sum();
                    if(index !== tokens.length || !Number.isFinite(value)) throw new Error("Invalid result");
                    return value;
                }
                function calculate(){
                    const ans = document.getElementById("ans");
                    try{ans.value = String(evaluateExpression(ans.value));}
                    catch(error){ans.value = "Error";}
                }
            </script>
        </table>
    </body>
</html>
