<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <script>
            var sum = 0;
            var n = 0;
            var max = -Infinity;
            var min = Infinity;

            while(true){
                var input = window.prompt("enter a number(-1 to exit): ");
                var num = Number(input);

                if(num === -1) break;

                sum += num;
                n += 1;

                max = Math.max(max, num);
                min = Math.min(min, num);
            }

            document.writeln("The avg is " + sum / n + "<br/>" + "The max is " + max + "<br/>" + "The min is " + min + "<br/>");
        </script>
    </head>
</html>
