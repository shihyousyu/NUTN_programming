<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Part1_Ch08_09_99table.htm</title>
    </head>

    <body>
        <p align="center">9X9 table</p>
        <table border="1" align="center">

        <script>
        for (let row = 0; row < 3; row++) {
            document.write("<tr>");
            for (let col = 1; col <= 3; col++) {
                let num = row * 3 + col;
                document.write("<td>");
                for (let i = 1; i <= 9; i++) {
                    document.write(num + "*" + i + "=" + (num*i) + "&#9<br>");
                }
                document.write("</td>");
            }
            document.write("</tr>");
        }
        </script>
        </table>
    </body>
</html>
